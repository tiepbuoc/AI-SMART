<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Chọn môn – Ngã Rẽ 10</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/ui.css"></head><body data-p="subjects"><main><div id="box"></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>onData(()=>{
const B=$("#box");let s=[];
const pre=cix(new URLSearchParams(location.search).get("nghe"));if(pre>=0)s=C[pre][3].split("|").filter(x=>SUBL.includes(x));
function pick(){B.innerHTML=`<h2>Chọn 4 môn</h2><div class="prog"><div class="bar"><b style="width:${s.length*25}%"></b></div><span>${s.length}/4</span></div><div class="opts pickg stg">${SUBL.map(x=>`<label class="opt sub"><input type="checkbox" value="${x}" ${s.includes(x)?"checked":""}><span>${x}</span></label>`).join("")}</div><p class="msg" id="msg" role="status"></p>`}
function out(){const r=C.map((c,i)=>({i,c,h:c[3].split("|").filter(x=>s.includes(x)).length})).sort((a,b)=>b.h-a.h).slice(0,3);
 B.innerHTML=`<h2>Nghề hợp tổ hợp này</h2><div class="card" style="margin-bottom:12px"><p class="lbl" style="margin-top:0">Lịch sử +</p>${chips(s,s)}</div><div class="stg">${r.map(t=>`<button class="card cbtn" data-pop="${t.i}" data-s="${s.join("|")}"><span class="ib" style="--gc:${GC[t.c[1]]}"><i class="fas fa-${GI[t.c[1]]}"></i></span><span class="cb"><span>${t.c[0]}</span><small>Trùng ${t.h}/4 môn</small></span><i class="fas fa-chevron-right"></i></button>`).join("")}</div><div class="row"><button class="btn alt" id="re"><i class="fas fa-arrow-left ic"></i>Chọn lại</button></div>`}
B.addEventListener("change",e=>{const x=e.target;if(x.type!=="checkbox")return;
 if(x.checked&&s.length>=4){x.checked=false;$("#msg").textContent="Đủ 4 môn rồi. Bỏ một môn trước.";return}
 s=$$("#pick input:checked,.opts input:checked").map(i=>i.value);$("#msg").textContent="";$(".bar b").style.width=s.length*25+"%";$(".prog span").textContent=s.length+"/4";
 if(s.length===4)setTimeout(()=>{out();scrollTo(0,0)},500)});
B.addEventListener("click",e=>{if(e.target.closest("#re")){s=[];pick()}});
s.length===4?out():pick();});</script></body></html>
