<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>AI Prompt Logger</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">

    <!-- ===== Khu vực đăng nhập / đăng ký ===== -->
    <div id="authSection" class="auth-section">
      <h1>Đăng nhập AI Prompt Logger</h1>
      <p class="auth-hint">Đăng nhập để đồng bộ lịch sử câu hỏi lên tài khoản của bạn.</p>
      <input id="authEmail" type="email" placeholder="Email" />
      <input id="authPassword" type="password" placeholder="Mật khẩu (≥ 6 ký tự)" />
      <div class="auth-actions">
        <button id="loginBtn">Đăng nhập</button>
        <button id="signupBtn">Đăng ký</button>
      </div>
      <div id="authMessage" class="auth-message"></div>
    </div>

    <!-- ===== Nội dung chính (chỉ hiện khi đã đăng nhập) ===== -->
    <div id="mainSection" class="main-section" style="display: none;">
      <header>
        <div class="user-row">
          <span id="currentEmail" class="current-email"></span>
          <button id="logoutBtn" class="link-btn">Đăng xuất</button>
        </div>
        <h1>Lịch sử câu hỏi AI</h1>
        <div class="header-actions">
          <button id="syncNowBtn" title="Đồng bộ lên Firebase">Đồng bộ ngay</button>
          <button id="exportJsonBtn" title="Xuất ra JSON">Xuất JSON</button>
          <button id="exportCsvBtn" title="Xuất ra CSV">Xuất CSV</button>
          <button id="clearAllBtn" class="danger" title="Xoá toàn bộ lịch sử">Xoá hết</button>
        </div>
        <div id="syncStatus" class="sync-status"></div>
        <label class="consent-row">
          <input type="checkbox" id="consentCheckbox" />
          Đồng ý đồng bộ dữ liệu hành vi lên AI Learning Passport
        </label>
      </header>

      <div class="filters">
        <input id="searchInput" type="text" placeholder="Tìm trong câu hỏi..." />
        <select id="siteFilter">
          <option value="all">Tất cả</option>
          <option value="chatgpt">ChatGPT</option>
          <option value="claude">Claude</option>
          <option value="gemini">Gemini</option>
        </select>
      </div>

      <div id="stats" class="stats"></div>

      <div id="list" class="list"></div>
    </div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="popup.js"></script>
</body>
</html>
