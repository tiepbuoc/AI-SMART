<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>AI SMART</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="resize-handle" id="resizeHandle" title="Kéo để đổi kích thước"></div>
  <div class="app">
    <header>
      <div class="brand-row">
        <span class="brand"><i class="fa-solid fa-compass"></i> AI SMART</span>
        <span id="connStatus" class="conn-badge">-</span>
      </div>

      <div id="notConnectedBox" class="not-connected-box" style="display:none;">
        <p>Chưa kết nối tài khoản. Kết nối để bật gợi ý SMART và đồng bộ dữ liệu.</p>
        <button id="connectBtn" class="primary-btn">Kết nối tài khoản</button>
      </div>

      <div id="connectedBox" style="display:none;">
        <div class="user-row">
          <span id="currentEmail" class="current-email"></span>
          <button id="logoutBtn" class="link-btn">Ngắt kết nối</button>
        </div>
        <label class="consent-row">
          <input type="checkbox" id="consentCheckbox" />
          Tự động đồng bộ liên tục dữ liệu lên AI Learning Passport
        </label>
        <div id="syncStatus" class="sync-status"></div>
      </div>

      <h1>Lịch sử câu hỏi AI</h1>
      <div class="header-actions">
        <button id="exportJsonBtn" title="Xuất ra JSON">Xuất JSON</button>
        <button id="exportCsvBtn" title="Xuất ra CSV">Xuất CSV</button>
        <button id="clearAllBtn" class="danger" title="Xoá toàn bộ lịch sử">Xoá hết</button>
      </div>
    </header>

    <div class="filters">
      <input id="searchInput" type="text" placeholder="Tìm trong câu hỏi..." />
      <select id="siteFilter">
        <option value="all">Tất cả</option>
        <option value="chatgpt">ChatGPT</option>
        <option value="claude">Claude</option>
        <option value="gemini">Gemini</option>
      </select>
    </div>

    <div id="stats" class="stats"></div>

    <div id="list" class="list"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
