<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Learning Passport & ACI</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css" />
<style>
  .loading-screen{ min-height: calc(100vh - 72px); display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; }
  .spinner{ width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--orange);
    border-radius:50%; animation:spin 0.9s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .loading-text{ font-size:13px; color:var(--text-mid); }

  .stat-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px; }
  .stat-card{ background:var(--card-bg); border:1px solid var(--border); border-radius:20px; padding:18px 20px; }
  .stat-card .num{ font-family:'Fraunces',serif; font-size:28px; font-weight:600; color:var(--orange2); }
  .stat-card .label{ font-size:11.5px; color:var(--text-mid); margin-top:4px; }

  .chart-row{ display:grid; grid-template-columns:1.4fr 1fr; gap:18px; margin-bottom:20px; }
  canvas{ max-width:100%; }

  table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  th,td{ text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); }
  th{ font-size:11px; color:var(--text-mid); font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
  .pill{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px; color:#fff; }
  .pill.low{ background:var(--green); }
  .pill.mid{ background:var(--gold); }
  .pill.high{ background:var(--red); }

  @media (max-width:800px){
    .stat-grid{ grid-template-columns:repeat(2,1fr); }
    .chart-row{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div id="guard" class="auth-screen"><p>Đang kiểm tra đăng nhập...</p></div>

<div id="page" style="display:none;">
  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <div id="loadingText" class="loading-text">Đang tải dữ liệu...</div>
  </div>

  <main id="dashboardContent" class="content" style="display:none;">
    <div class="section-label"><i class="fa-solid fa-route"></i> AI Learning Passport</div>
    <h2 class="section-title">Thống kê sử dụng AI của bạn</h2>

    <div class="stat-grid">
      <div class="stat-card"><div id="statAci" class="num">-</div><div class="label">ACI trung bình</div></div>
      <div class="stat-card"><div id="statEffort" class="num">-</div><div class="label">Nỗ lực tự thân TB</div></div>
      <div class="stat-card"><div id="statComplexity" class="num">-</div><div class="label">Độ phức tạp TB</div></div>
      <div class="stat-card"><div id="statTotal" class="num">-</div><div class="label">Tổng số câu hỏi</div></div>
    </div>

    <div class="chart-row">
      <div class="card">
        <h3 class="section-title" style="font-size:15px;">Xu hướng ACI theo thời gian</h3>
        <canvas id="aciTrendChart" height="160"></canvas>
      </div>
      <div class="card">
        <h3 class="section-title" style="font-size:15px;">Phân bố theo môn học</h3>
        <canvas id="subjectChart" height="160"></canvas>
      </div>
    </div>

    <div class="card">
      <h3 class="section-title" style="font-size:15px;">Lịch sử chi tiết</h3>
      <table>
        <thead>
          <tr><th>Thời gian</th><th>Nền tảng</th><th>Câu hỏi</th><th>ACI</th><th>Rủi ro ỷ lại</th></tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </main>
</div>

<script src="nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script type="module">
import { watchAuth, getApiConfig, logout } from "./auth-web.js";
import { db } from "./firebase-config.js";
import {
  collection, query, where, getDocs, doc, updateDoc,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { analyzePromptsBatch, subjectCodeToLabel } from "./smart-shared.js";

const guard = document.getElementById("guard");
const page = document.getElementById("page");
const loadingScreen = document.getElementById("loadingScreen");
const loadingText = document.getElementById("loadingText");
const dashboardContent = document.getElementById("dashboardContent");

const nav = renderSiteNav("passport");

watchAuth(
  async (user) => {
    guard.style.display = "none";
    page.style.display = "block";
    nav.setUser(user.email, () => logout());
    await runPipeline(user.uid);
  },
  () => { window.location.href = "index.html"; }
);

async function runPipeline(uid) {
  try {
    loadingText.textContent = "Đang tải cấu hình API...";
    const apiConfig = await getApiConfig();

    loadingText.textContent = "Đang tải lịch sử sử dụng AI...";
    const entriesCol = collection(db, "users", uid, "entries");

    const unanalyzedSnap = await getDocs(query(entriesCol, where("analyzed", "==", false)));
    const unanalyzed = unanalyzedSnap.docs.map((d) => ({ id: d.id, ...d.data() }));

    if (unanalyzed.length > 0) {
      if (!apiConfig.apiKey) {
        loadingText.textContent = `Có ${unanalyzed.length} câu hỏi chưa phân tích nhưng chưa có API key.`;
      } else {
        loadingText.textContent = `Đang phân tích ${unanalyzed.length} câu hỏi mới bằng AI...`;
        const texts = unanalyzed.map((e) => e.text || "");
        const results = await analyzePromptsBatch({
          endpoint: apiConfig.endpoint,
          apiKey: apiConfig.apiKey,
          model: apiConfig.model,
          prompts: texts,
        });

        loadingText.textContent = "Đang lưu kết quả phân tích...";
        for (let i = 0; i < unanalyzed.length; i++) {
          const [aci, complexity, effort, subjectCode, riskScore] = results[i];
          await updateDoc(doc(db, "users", uid, "entries", unanalyzed[i].id), {
            analysis: { aci, complexity, effort, subjectCode, riskScore },
            analyzed: true,
          });
        }
      }
    }

    loadingText.textContent = "Đang tổng hợp thống kê...";
    const allSnap = await getDocs(query(entriesCol, where("analyzed", "==", true)));
    const allEntries = allSnap.docs
      .map((d) => ({ id: d.id, ...d.data() }))
      .sort((a, b) => new Date(a.time) - new Date(b.time));

    renderDashboard(allEntries);

    loadingScreen.style.display = "none";
    dashboardContent.style.display = "block";
  } catch (err) {
    loadingText.textContent = "Lỗi: " + err.message;
  }
}

function riskPillClass(score) {
  if (score >= 66) return "high";
  if (score >= 33) return "mid";
  return "low";
}

function formatTime(iso) {
  const d = new Date(iso);
  return d.toLocaleString("vi-VN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function renderDashboard(entries) {
  const withAnalysis = entries.filter((e) => e.analysis);
  const total = withAnalysis.length;

  const avg = (key) =>
    total === 0 ? 0 : Math.round(withAnalysis.reduce((s, e) => s + (e.analysis[key] || 0), 0) / total);

  document.getElementById("statAci").textContent = avg("aci");
  document.getElementById("statEffort").textContent = avg("effort");
  document.getElementById("statComplexity").textContent = avg("complexity");
  document.getElementById("statTotal").textContent = total;

  const trendLabels = withAnalysis.map((e) => formatTime(e.time));
  const trendData = withAnalysis.map((e) => e.analysis.aci);
  new Chart(document.getElementById("aciTrendChart"), {
    type: "line",
    data: {
      labels: trendLabels,
      datasets: [{
        label: "AI Crutch Index",
        data: trendData,
        borderColor: "#e67e22",
        backgroundColor: "rgba(230,126,34,0.12)",
        tension: 0.25,
        fill: true,
        pointRadius: 2,
      }],
    },
    options: { scales: { y: { min: 0, max: 100 } }, plugins: { legend: { display: false } } },
  });

  const subjectCounts = {};
  withAnalysis.forEach((e) => {
    const label = subjectCodeToLabel(e.analysis.subjectCode);
    subjectCounts[label] = (subjectCounts[label] || 0) + 1;
  });
  new Chart(document.getElementById("subjectChart"), {
    type: "doughnut",
    data: {
      labels: Object.keys(subjectCounts),
      datasets: [{
        data: Object.values(subjectCounts),
        backgroundColor: ["#e67e22", "#f39c12", "#e74c3c", "#1f9d6c", "#9b7fd4", "#95a5a6"],
      }],
    },
    options: { plugins: { legend: { position: "bottom", labels: { boxWidth: 10, font: { size: 10 } } } } },
  });

  const tbody = document.getElementById("historyBody");
  tbody.innerHTML = "";
  withAnalysis.slice().reverse().slice(0, 100).forEach((e) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${formatTime(e.time)}</td>
      <td>${e.site || "-"}</td>
      <td style="max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;"></td>
      <td><span class="pill ${riskPillClass(e.analysis.aci)}">${e.analysis.aci}</span></td>
      <td><span class="pill ${riskPillClass(e.analysis.riskScore)}">${e.analysis.riskScore}</span></td>
    `;
    tr.children[2].textContent = e.text || "";
    tbody.appendChild(tr);
  });
}
</script>
</body>
</html>
