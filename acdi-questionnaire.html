<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ACDI Check — Bảng hỏi</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="guard" class="auth-screen"><p>Đang kiểm tra đăng nhập...</p></div>

<div id="page" style="display:none;">
<main class="acdi-wrap">
  <div class="acdi-progress-label" id="progressLabel">Bước 2/3 · Nhóm 1/5</div>
  <div class="acdi-progress-track"><div class="acdi-progress-fill" id="progressFill" style="width:12%"></div></div>

  <div class="card">
    <div class="acdi-group-title" id="groupTitle"></div>
    <div class="acdi-group-desc" id="groupDesc"></div>
    <div id="questionsWrap"></div>

    <div id="groupMsg" style="font-size:12.5px; color:var(--red); min-height:16px;"></div>

    <div class="acdi-nav-btns">
      <button id="backBtn" class="acdi-btn-secondary">Quay lại</button>
      <button id="nextBtn" class="acdi-btn-primary">Tiếp tục <i class="fa-solid fa-arrow-right"></i></button>
    </div>
  </div>
</main>
</div>

<script src="nav.js"></script>
<script type="module">
import { watchAuth, logout, getUserProfile } from "./auth-web.js";
import { DEFAULT_ACDI_GROUPS, LIKERT_OPTIONS } from "./acdi-shared.js";

const guard = document.getElementById("guard");
const page = document.getElementById("page");
const nav = renderSiteNav("acdi");

// Bắt buộc phải hoàn thành Trang 2 (thông tin khảo sát) trước
let info = null;
try { info = JSON.parse(localStorage.getItem("acdi_info") || "null"); } catch { info = null; }
if (!info || !info.consent) { window.location.href = "acdi-info.html"; }

// Bộ đề (do AI soạn hoặc tái sử dụng từ đề đã có sẵn cho cùng tiêu chí) được chuẩn bị sẵn
// ở trang Thông tin khảo sát (acdi-info.html) và lưu vào localStorage — nếu vì lý do gì đó
// chưa có (ví dụ người dùng vào thẳng URL này), dùng bộ đề mặc định làm phương án dự phòng.
let test = null;
try { test = JSON.parse(localStorage.getItem("acdi_test") || "null"); } catch { test = null; }
const ACDI_GROUPS = (test && Array.isArray(test.groups) && test.groups.length === 5) ? test.groups : DEFAULT_ACDI_GROUPS;

let answers = {};
try { answers = JSON.parse(localStorage.getItem("acdi_answers") || "{}"); } catch { answers = {}; }

let groupIndex = 0; // luôn bắt đầu ở Nhóm 1 mỗi khi vào trang này (không nhớ vị trí giữa các lần)

const groupTitleEl = document.getElementById("groupTitle");
const groupDescEl = document.getElementById("groupDesc");
const questionsWrap = document.getElementById("questionsWrap");
const progressLabel = document.getElementById("progressLabel");
const progressFill = document.getElementById("progressFill");
const groupMsg = document.getElementById("groupMsg");
const backBtn = document.getElementById("backBtn");
const nextBtn = document.getElementById("nextBtn");

function renderGroup() {
  const g = ACDI_GROUPS[groupIndex];
  groupTitleEl.textContent = `Nhóm ${groupIndex + 1}/5 · ${g.title}`;
  groupDescEl.textContent = g.desc;
  groupMsg.textContent = "";

  questionsWrap.innerHTML = g.questions.map((q, qi) => `
    <div class="acdi-q-block">
      <div class="acdi-q-text">${qi + 1}. ${q.text}</div>
      <div class="acdi-likert">
        ${LIKERT_OPTIONS.map((o) => `
          <label>
            <input type="radio" name="${q.id}" value="${o.value}" ${answers[q.id] === o.value ? "checked" : ""} />
            ${o.label}
          </label>
        `).join("")}
      </div>
    </div>
  `).join("");

  questionsWrap.querySelectorAll("input[type=radio]").forEach((inp) => {
    inp.addEventListener("change", (e) => {
      answers[e.target.name] = Number(e.target.value);
      localStorage.setItem("acdi_answers", JSON.stringify(answers));
    });
  });

  const overallStep = groupIndex + 1;
  const pct = 12 + Math.round((overallStep / ACDI_GROUPS.length) * 55); // 3 bước lớn: info(12%) + questionnaire(~55%) + scenarios(~33%)
  progressLabel.textContent = `Bước 2/3 · Nhóm ${overallStep}/5`;
  progressFill.style.width = pct + "%";

  backBtn.textContent = groupIndex === 0 ? "Quay lại thông tin" : "Nhóm trước";
  nextBtn.innerHTML = groupIndex === ACDI_GROUPS.length - 1
    ? 'Tiếp tục sang tình huống <i class="fa-solid fa-arrow-right"></i>'
    : 'Nhóm tiếp theo <i class="fa-solid fa-arrow-right"></i>';
}

function groupComplete(g) {
  return g.questions.every((q) => answers[q.id] !== undefined);
}

backBtn.onclick = () => {
  if (groupIndex === 0) { window.location.href = "acdi-info.html"; return; }
  groupIndex--;
  renderGroup();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

nextBtn.onclick = () => {
  const g = ACDI_GROUPS[groupIndex];
  if (!groupComplete(g)) {
    groupMsg.textContent = "Vui lòng trả lời đủ tất cả câu hỏi trong nhóm này trước khi tiếp tục.";
    return;
  }
  if (groupIndex === ACDI_GROUPS.length - 1) {
    window.location.href = "acdi-scenarios.html";
    return;
  }
  groupIndex++;
  renderGroup();
  window.scrollTo({ top: 0, behavior: "smooth" });
};

watchAuth(
  async (user) => {
    const profile = await getUserProfile(user.uid);
    if (profile.role === "teacher") {
      window.location.href = "teacher.html";
      return;
    }
    guard.style.display = "none";
    page.style.display = "block";
    nav.setUser(user.email, () => logout());
    renderGroup();
  },
  () => { window.location.href = "index.html"; }
);
</script>
</body>
</html>
