<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>So sánh – Ngã Rẽ 10</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/ui.css"></head><body data-p="compare"><main><div id="box"></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>onData(()=>{
const CR=[["hu","Mình hứng thú"],["mo","Hợp môn mình học"],["gd","Gia đình ủng hộ"],["vl","Cơ hội việc làm"]],RK="ngare10_rate";let st=0;const B=$("#box");
const rate=(v,id,k)=>`<span class="rate">${[1,2,3,4,5].map(n=>`<button class="dot ${n<=v?"on":""}" data-r="${id}" data-k="${k}" data-n="${n}" aria-label="${n}">${n}</button>`).join("")}</span>`;
function draw(){const l=store.get(CMP,[]).map(cix).filter(i=>i>=0),R=store.get(RK,{w:{},r:{}});
 if(!l.length){B.innerHTML=`<div class="card qcard"><span class="qic"><i class="fas fa-scale-balanced"></i></span><h3 class="qt">Chưa có nghề để so sánh</h3><a class="btn" href="nghe-nghiep.html">Chọn nghề</a></div>`;return}
 const w=k=>R.w[k]||3,rt=(i,k)=>(R.r[cid(i)]||{})[k]||3,n=CR.length;
 if(st<n){const k=CR[st][0];B.innerHTML=`<div class="prog"><div class="bar"><b style="width:${st/n*100}%"></b></div><span>${st+1}/${n}</span></div><div class="card"><h3 class="qt" style="margin-top:0">${CR[st][1]}</h3><p class="lbl" style="margin-top:0">Quan trọng với bạn</p>${rate(w(k),"w",k)}${l.map(i=>`<div class="cr"><p class="lbl" style="margin:26px 0 10px"><b style="color:var(--ink);display:inline">${C[i][0]}</b></p>${rate(rt(i,k),cid(i),k)}</div>`).join("")}</div><div class="nav2"><button class="btn alt" id="bk" aria-label="Quay lại" ${st?"":"disabled"}><i class="fas fa-arrow-left"></i></button><button class="btn" id="nx">${st===n-1?"Xem kết quả":"Tiếp"}<i class="fas fa-arrow-right" style="margin-left:9px"></i></button></div>`;return}
 const tot=l.map(i=>{let s=0,t=0;CR.forEach(c=>{s+=w(c[0])*rt(i,c[0]);t+=w(c[0])*5});return Math.round(s/t*100)}),best=Math.max(...tot);
 B.innerHTML=`<h2>Kết quả</h2><div class="card stg">${l.map((i,j)=>`<div class="res"><span class="ib" style="--gc:${GC[C[i][1]]}"><i class="fas fa-${GI[C[i][1]]}"></i></span><div><b>${C[i][0]}</b> ${tot[j]===best&&l.length>1?`<span class="best">Cao nhất</span>`:""}<div class="bar"><b style="width:${tot[j]}%;background:${GC[C[i][1]]}"></b></div></div><b>${tot[j]}</b><button class="btn alt sm" data-cmp="${i}" aria-label="Bỏ"><i class="fas fa-xmark"></i></button></div>`).join("")}</div><div class="row"><button class="btn" id="tp"><i class="fas fa-flag-checkered ic"></i>Chọn làm phương án chính</button><button class="btn alt" id="bk" aria-label="Quay lại"><i class="fas fa-arrow-left"></i></button></div>`;
 $("#tp").onclick=()=>{const p=store.get(PLAN,{});p.main=cid(l[tot.indexOf(best)]);store.set(PLAN,p);toast("Đã đặt làm phương án chính");setTimeout(()=>location.href="ke-hoach.html",700)}}
B.addEventListener("click",e=>{const d=e.target.closest(".dot");
 if(d){const R=store.get(RK,{w:{},r:{}}),k=d.dataset.k,id=d.dataset.r,v=+d.dataset.n;if(id==="w")R.w[k]=v;else(R.r[id]=R.r[id]||{})[k]=v;store.set(RK,R);$$(".dot",d.parentNode).forEach(x=>x.classList.toggle("on",+x.dataset.n<=v));return}
 if(e.target.closest("#nx")){st++;draw();scrollTo(0,0)}
 if(e.target.closest("#bk")&&(st>0)){st=Math.min(st,CR.length)-1;draw();scrollTo(0,0)}});
window.onCmpChange=()=>{st=Math.min(st,CR.length);draw()};draw();});</script></body></html>
