<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Kế hoạch – Ngã Rẽ 10</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/ui.css"></head><body data-p="plan"><main><div id="box"></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>onData(()=>{
const P=store.get(PLAN,{});P.todo=P.todo||{};let st=0;const B=$("#box"),N=4;
const OP=v=>`<option value="">Chưa chọn</option>`+C.map(c=>`<option value="${c[6]}" ${c[6]===v?"selected":""}>${c[0]}</option>`).join("")+`<option value="gdtx" ${v==="gdtx"?"selected":""}>Giáo dục thường xuyên</option><option value="nghe" ${v==="nghe"?"selected":""}>Trường nghề</option>`;
const ex={gdtx:"Học văn hóa linh hoạt, có thể kết hợp học nghề.",nghe:"Học nghề sớm, đi làm nhanh, vẫn có thể liên thông."};
const info=v=>{const k=cix(v);return !v?"":k>=0?`<button class="btn alt sm" data-pop="${k}"><i class="fas fa-circle-info ic"></i>Chi tiết</button>`:`<p class="soft">${ex[v]||""}</p>`};
const save=()=>store.set(PLAN,P);
function draw(){const T=["Phương án chính","Phương án dự phòng","Trường và ghi chú","Việc cần làm"][st];let h="";
 if(st<2){const k=st?"backup":"main";h=`<select class="big" id="s_${k}" aria-label="${T}">${OP(P[k])}</select><div id="inf">${info(P[k])}</div>`}
 else if(st===2)h=`<label class="field">Trường mục tiêu<input type="text" id="school" value="${esc(P.school||"")}"></label><label class="field">Ghi chú<textarea id="notes">${esc(P.notes||"")}</textarea></label>`;
 else h=TODO.map((t,i)=>`<div class="chk" style="flex-wrap:wrap"><input type="checkbox" id="t${i}" data-i="${i}" ${(P.todo[i]||{}).d?"checked":""}><label for="t${i}" style="flex:1;min-width:200px">${t}</label><input type="date" data-dt="${i}" value="${(P.todo[i]||{}).dt||""}" aria-label="Hạn"></div>`).join("");
 B.innerHTML=`<div class="prog"><div class="bar"><b style="width:${(st+1)/N*100}%"></b></div><span>${st+1}/${N}</span></div><div class="card"><h3 class="qt" style="margin-top:0">${T}</h3>${h}</div><div class="nav2"><button class="btn alt" id="bk" aria-label="Quay lại" ${st?"":"disabled"}><i class="fas fa-arrow-left"></i></button>${st<N-1?`<button class="btn" id="nx">Tiếp<i class="fas fa-arrow-right" style="margin-left:9px"></i></button>`:`<button class="btn" onclick="print()"><i class="fas fa-print ic"></i>In / PDF</button>`}</div>`}
B.addEventListener("click",e=>{if(e.target.closest("#nx")){st++;draw();scrollTo(0,0)}if(e.target.closest("#bk")&&st){st--;draw();scrollTo(0,0)}});
B.addEventListener("change",e=>{const t=e.target;
 if(t.id==="s_main"||t.id==="s_backup"){P[t.id.slice(2)]=t.value;$("#inf").innerHTML=info(t.value);save()}
 else if(t.dataset.i!==undefined||t.dataset.dt!==undefined){const i=t.dataset.i??t.dataset.dt;P.todo[i]=P.todo[i]||{};if(t.dataset.i!==undefined)P.todo[i].d=t.checked;else P.todo[i].dt=t.value;save()}});
B.addEventListener("input",e=>{if(e.target.id==="school"){P.school=e.target.value;save()}if(e.target.id==="notes"){P.notes=e.target.value;save()}});draw();});</script></body></html>
