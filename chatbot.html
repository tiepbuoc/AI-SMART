<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI SMART Chatbot</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  body{ height:100vh; overflow:hidden; padding-top:72px; }
  #chatWrap{ height:calc(100vh - 72px); display:flex; flex-direction:column; background:var(--bg); }
  .cb-header{ padding:10px 5%; background:var(--card-bg); border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px; }
  .smart-steps{ display:flex; gap:6px; font-size:11px; color:var(--text-mid); flex-wrap:wrap; justify-content:center; }
  .smart-steps span{ background:var(--orange-pale); color:var(--orange2); border-radius:999px; padding:5px 12px; font-weight:600; }
  #chat{ flex:1; overflow-y:auto; padding:20px 5%; display:flex; flex-direction:column; gap:14px; background:var(--bg); }
  .msg{max-width:75%; padding:13px 17px; border-radius:20px; line-height:1.6; font-size:14.5px; word-wrap:break-word;}
  .msg.user{align-self:flex-end; background:linear-gradient(135deg,var(--orange2),var(--orange)); color:#fff; border-bottom-right-radius:6px;}
  .msg.bot{align-self:flex-start; background:var(--card-bg); border:1px solid var(--border); border-bottom-left-radius:6px; color:var(--text-dark);}
  .msg.error{align-self:flex-start; background:var(--red-pale); border:1px solid #f3b9b9; color:#b3403a;}
  .role-label{font-size:11px; color:var(--text-mid); margin-bottom:5px; font-weight:700;}
  .msg.user .role-label{ color:rgba(255,255,255,0.85); }
  .msg-body p{ margin:0 0 8px; }
  .msg-body p:last-child{ margin-bottom:0; }
  .msg-body ul, .msg-body ol{ margin:0 0 8px; padding-left:20px; }
  .msg-body code{ background:rgba(0,0,0,0.06); padding:1px 5px; border-radius:5px; font-size:13px; }
  .msg-body pre{ background:#2c3e50; color:#fef5e8; padding:10px 12px; border-radius:12px; overflow-x:auto; }
  .msg-body pre code{ background:none; color:inherit; padding:0; }
  .msg-body h1,.msg-body h2,.msg-body h3{ margin:10px 0 6px; font-size:15px; font-family:'Fraunces',serif; }
  .msg-body hr{ border:none; border-top:1px solid var(--border); margin:10px 0; }
  #inputBar{ padding:14px 5% 18px; background:var(--card-bg); border-top:1px solid var(--border);
    display:flex; flex-direction:column; gap:8px; }
  #row2{display:flex; gap:8px; align-items:flex-end;}
  #textInput{ flex:1; resize:none; min-height:48px; max-height:140px; padding:13px 18px;
    background:#fff; border:1.5px solid var(--border); color:var(--text-dark);
    border-radius:18px; font-size:14.5px; outline:none; font-family:'DM Sans',sans-serif; }
  #textInput:focus{border-color:var(--orange);}
  button.icon-btn{ width:48px; height:48px; border-radius:16px; border:1.5px solid var(--border);
    background:#fff; color:var(--text-dark); cursor:pointer; font-size:17px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #sendBtn{ background:linear-gradient(135deg,var(--orange2),var(--orange)); border:none; color:#fff;
    box-shadow:0 4px 14px rgba(230,126,34,0.3); }
  #sendBtn:disabled{opacity:.5; cursor:not-allowed;}
  #status{font-size:12px; color:var(--text-mid); min-height:16px; text-align:center;}
</style>
</head>
<body>

<div id="guard" class="auth-screen"><p>Đang kiểm tra đăng nhập...</p></div>

<div id="chatWrap" style="display:none;">
  <header class="cb-header">
    <div class="smart-steps" id="stepsBar"></div>
  </header>

  <div id="chat"></div>

  <div id="inputBar">
    <div id="status"></div>
    <div id="row2">
      <textarea id="textInput" placeholder="Nhập câu hỏi bài tập của bạn... (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
      <button class="icon-btn" id="sendBtn" title="Gửi"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>
</div>

<script src="nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<script type="module">
import { watchAuth, getApiConfig, logout } from "./auth-web.js";
import { db } from "./firebase-config.js";
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { SMART_SYSTEM_PROMPT, SMART_STEPS_VI, callAiApi } from "./smart-shared.js";

const guard = document.getElementById("guard");
const chatWrap = document.getElementById("chatWrap");
const chatEl = document.getElementById('chat');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
const stepsBar = document.getElementById('stepsBar');

const nav = renderSiteNav("chatbot");
stepsBar.innerHTML = SMART_STEPS_VI.map((s, i) => `<span title="${s.desc}">${i + 1}. ${s.label}</span>`).join("");

let currentUser = null;
let apiConfig = null;
let history = [{ role: "system", content: SMART_SYSTEM_PROMPT }];

watchAuth(
  async (user) => {
    currentUser = user;
    apiConfig = await getApiConfig();
    guard.style.display = "none";
    chatWrap.style.display = "flex";
    nav.setUser(user.email, () => logout());
  },
  () => { window.location.href = "index.html"; }
);

textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.onclick = sendMessage;

function renderBotContent(container, rawText) {
  const html = marked.parse(rawText, { breaks: true });
  container.innerHTML = DOMPurify.sanitize(html);
  if (window.renderMathInElement) {
    renderMathInElement(container, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false },
        { left: "\\[", right: "\\]", display: true },
      ],
      throwOnError: false,
    });
  }
}

function addMessageToUI(role, text){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const label = role === 'user' ? 'Bạn' : role === 'bot' ? 'AI SMART' : 'Lỗi';
  const body = document.createElement('div');
  body.className = 'msg-body';
  wrap.innerHTML = `<div class="role-label">${label}</div>`;
  wrap.appendChild(body);
  if (role === 'bot') renderBotContent(body, text);
  else body.textContent = text;
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return { wrap, body };
}

async function logToFirestore(userText, botReply) {
  if (!currentUser) return;
  try {
    await addDoc(collection(db, "users", currentUser.uid, "entries"), {
      site: "website-chatbot",
      text: userText,
      reply: botReply,
      time: new Date().toISOString(),
      analyzed: false,
      createdAt: serverTimestamp(),
    });
  } catch (e) {
    console.error("Không lưu được log:", e);
  }
}

async function sendMessage(){
  const text = textInput.value.trim();
  if (!text) return;
  if (!apiConfig || !apiConfig.apiKey) {
    statusEl.textContent = '⚠️ Chưa có cấu hình API.';
    return;
  }

  addMessageToUI('user', text);
  history.push({ role: 'user', content: text });
  textInput.value = '';
  sendBtn.disabled = true;
  statusEl.textContent = '⏳ Đang gửi yêu cầu...';

  const bot = addMessageToUI('bot', '...');

  try {
    const reply = await callAiApi({
      endpoint: apiConfig.endpoint,
      apiKey: apiConfig.apiKey,
      model: apiConfig.model,
      messages: history,
    });
    const finalReply = reply || '(Không có nội dung trả về)';
    renderBotContent(bot.body, finalReply);
    history.push({ role: 'assistant', content: finalReply });
    statusEl.textContent = '';
    logToFirestore(text, finalReply);
  } catch (err) {
    bot.wrap.remove();
    addMessageToUI('error', 'Lỗi khi gọi API: ' + err.message);
    statusEl.textContent = '';
  } finally {
    sendBtn.disabled = false;
  }
}
</script>
</body>
</html>
