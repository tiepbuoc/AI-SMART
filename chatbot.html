<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI SMART Chatbot</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
  body{ height:100vh; overflow:hidden; }
  #chatWrap{ height:100vh; display:flex; flex-direction:column; background:var(--bg); }
  .cb-header{ padding:12px 20px; background:#fff; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .cb-header h1{ font-size:16px; margin:0; font-weight:700; color:var(--ink); }
  .smart-steps{ display:flex; gap:6px; font-size:11px; color:var(--ink-soft); flex-wrap:wrap; }
  .smart-steps span{ background:var(--blue-soft); color:var(--blue); border-radius:999px; padding:4px 10px; font-weight:600; }
  #chat{ flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; background:var(--bg-soft); }
  .msg{max-width:75%; padding:12px 16px; border-radius:16px; line-height:1.6; font-size:14.5px; word-wrap:break-word;}
  .msg.user{align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:4px;}
  .msg.bot{align-self:flex-start; background:#fff; border:1px solid var(--line); border-bottom-left-radius:4px; color:var(--ink);}
  .msg.error{align-self:flex-start; background:var(--red-soft); border:1px solid #f3b9b9; color:#b3403a;}
  .role-label{font-size:11px; color:var(--ink-soft); margin-bottom:4px; font-weight:700;}
  .msg.user .role-label{ color:rgba(255,255,255,0.8); }
  .msg-body p{ margin:0 0 8px; }
  .msg-body p:last-child{ margin-bottom:0; }
  .msg-body ul, .msg-body ol{ margin:0 0 8px; padding-left:20px; }
  .msg-body code{ background:rgba(0,0,0,0.06); padding:1px 5px; border-radius:5px; font-size:13px; }
  .msg-body pre{ background:#1e2433; color:#e6e8ec; padding:10px 12px; border-radius:10px; overflow-x:auto; }
  .msg-body pre code{ background:none; color:inherit; padding:0; }
  .msg-body h1,.msg-body h2,.msg-body h3{ margin:10px 0 6px; font-size:15px; }
  .msg-body hr{ border:none; border-top:1px solid var(--line); margin:10px 0; }
  .msg-body strong{ color:inherit; }
  #inputBar{ padding:14px 20px; background:#fff; border-top:1px solid var(--line);
    display:flex; flex-direction:column; gap:8px; }
  #row2{display:flex; gap:8px; align-items:flex-end;}
  #textInput{ flex:1; resize:none; min-height:46px; max-height:140px; padding:12px 16px;
    background:var(--bg-soft); border:1.5px solid var(--line); color:var(--ink);
    border-radius:14px; font-size:14.5px; outline:none; font-family:inherit; }
  #textInput:focus{border-color:var(--blue); background:#fff;}
  button.icon-btn{ width:46px; height:46px; border-radius:14px; border:1.5px solid var(--line);
    background:var(--bg-soft); color:var(--ink); cursor:pointer; font-size:18px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  #sendBtn{ background:var(--blue); border:none; color:#fff; font-weight:700; }
  #sendBtn:disabled{opacity:.5; cursor:not-allowed;}
  #status{font-size:12px; color:var(--ink-soft); min-height:16px;}
</style>
</head>
<body>

<div id="guard" class="auth-screen"><p>Đang kiểm tra đăng nhập...</p></div>

<div id="chatWrap" style="display:none;">
  <header class="cb-header">
    <h1>🧭 AI SMART Chatbot</h1>
    <div class="smart-steps" id="stepsBar"></div>
    <div style="display:flex; gap:10px; align-items:center;">
      <a href="index.html" style="color:var(--ink-soft); font-size:12px;">← Trang chủ</a>
    </div>
  </header>

  <div id="chat"></div>

  <div id="inputBar">
    <div id="status"></div>
    <div id="row2">
      <textarea id="textInput" placeholder="Nhập câu hỏi bài tập của bạn... (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
      <button class="icon-btn" id="sendBtn" title="Gửi">➤</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<script type="module">
import { watchAuth, getApiConfig } from "./auth-web.js";
import { db } from "./firebase-config.js";
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { SMART_SYSTEM_PROMPT, SMART_STEPS_VI, callAiApi } from "./smart-shared.js";

const guard = document.getElementById("guard");
const chatWrap = document.getElementById("chatWrap");
const chatEl = document.getElementById('chat');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
const stepsBar = document.getElementById('stepsBar');

stepsBar.innerHTML = SMART_STEPS_VI.map((s, i) => `<span title="${s.desc}">${i + 1}. ${s.label}</span>`).join("");

let currentUser = null;
let apiConfig = null;
let history = [{ role: "system", content: SMART_SYSTEM_PROMPT }];

watchAuth(
  async (user) => {
    currentUser = user;
    apiConfig = await getApiConfig();
    guard.style.display = "none";
    chatWrap.style.display = "flex";
  },
  () => { window.location.href = "index.html"; }
);

textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.onclick = sendMessage;

function renderBotContent(container, rawText) {
  // Bảo vệ các đoạn LaTeX ($...$, $$...$$) khỏi bị marked xử lý nhầm cú pháp markdown bên trong
  const html = marked.parse(rawText, { breaks: true });
  container.innerHTML = DOMPurify.sanitize(html);
  if (window.renderMathInElement) {
    renderMathInElement(container, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
        { left: "\\(", right: "\\)", display: false },
        { left: "\\[", right: "\\]", display: true },
      ],
      throwOnError: false,
    });
  }
}

function addMessageToUI(role, text){
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  const label = role === 'user' ? 'Bạn' : role === 'bot' ? 'AI SMART' : 'Lỗi';
  const body = document.createElement('div');
  body.className = 'msg-body';
  wrap.innerHTML = `<div class="role-label">${label}</div>`;
  wrap.appendChild(body);
  if (role === 'bot') {
    renderBotContent(body, text);
  } else {
    body.textContent = text;
  }
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return { wrap, body };
}

async function logToFirestore(userText, botReply) {
  if (!currentUser) return;
  try {
    await addDoc(collection(db, "users", currentUser.uid, "entries"), {
      site: "website-chatbot",
      text: userText,
      reply: botReply,
      time: new Date().toISOString(),
      analyzed: false,
      createdAt: serverTimestamp(),
    });
  } catch (e) {
    console.error("Không lưu được log:", e);
  }
}

async function sendMessage(){
  const text = textInput.value.trim();
  if (!text) return;
  if (!apiConfig || !apiConfig.apiKey) {
    statusEl.textContent = '⚠️ Chưa có cấu hình API.';
    return;
  }

  addMessageToUI('user', text);
  history.push({ role: 'user', content: text });
  textInput.value = '';
  sendBtn.disabled = true;
  statusEl.textContent = '⏳ Đang gửi yêu cầu...';

  const bot = addMessageToUI('bot', '...');

  try {
    const reply = await callAiApi({
      endpoint: apiConfig.endpoint,
      apiKey: apiConfig.apiKey,
      model: apiConfig.model,
      messages: history,
    });
    const finalReply = reply || '(Không có nội dung trả về)';
    renderBotContent(bot.body, finalReply);
    history.push({ role: 'assistant', content: finalReply });
    statusEl.textContent = '';
    logToFirestore(text, finalReply);
  } catch (err) {
    bot.wrap.remove();
    addMessageToUI('error', 'Lỗi khi gọi API: ' + err.message);
    statusEl.textContent = '';
  } finally {
    sendBtn.disabled = false;
  }
}
</script>
</body>
</html>
