<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Khảo sát – Ngã Rẽ 10</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/ui.css"></head><body data-p="survey"><main><div id="wz" aria-live="polite"></div><div id="result" hidden></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>onData(()=>{
const IC=["face-frown","face-meh","face-grin-stars"];
let a=Q.map(()=>null),step=0,s=[],lock=false,D0=null;const W=$("#wz"),R=$("#result");
const prog=(i,n,t)=>`<div class="prog"><div class="bar"><b style="width:${i/n*100}%"></b></div><span>${t||(i+1)+"/"+n}</span></div>`;
function wz(){const n=Q.length;
 if(step<n)W.innerHTML=`${prog(step,n)}<div class="card qcard"><span class="qic" style="--gc:${GC[Q[step][0]]}"><i class="fas fa-${GI[Q[step][0]]}"></i></span><h3 class="qt">${Q[step][1]}</h3><div class="anss">${LV.map((l,j)=>`<button class="ans ${a[step]===j?"on":""}" data-v="${j}"><i class="fas fa-${IC[j]}"></i>${l}</button>`).join("")}</div></div><div class="nav2"><button class="btn alt" id="bk" aria-label="Quay lại" ${step?"":"disabled"}><i class="fas fa-arrow-left"></i></button></div>`;
 else W.innerHTML=`${prog(n,n,"Câu cuối")}<div class="card qcard"><h3 class="qt">Môn bạn mạnh nhất?</h3><p class="soft" style="margin-top:-14px">Chọn tối đa 3</p><div class="opts pickg" id="subs" style="justify-content:center">${SUB.map(x=>`<label class="opt sub"><input type="checkbox" value="${x}" ${s.includes(x)?"checked":""}><span>${x}</span></label>`).join("")}</div><p class="msg" id="msg" role="alert"></p></div><div class="nav2"><button class="btn alt" id="bk" aria-label="Quay lại"><i class="fas fa-arrow-left"></i></button><button class="btn" id="go">Xem kết quả<i class="fas fa-arrow-right" style="margin-left:9px"></i></button></div>`;
 const t=$(".qt");t.tabIndex=-1;t.focus({preventScroll:true})}
W.addEventListener("click",e=>{const b=e.target.closest(".ans");
 if(b&&!lock){lock=true;a[step]=+b.dataset.v;$$(".ans").forEach(x=>x.classList.toggle("on",x===b));setTimeout(()=>{lock=false;step++;wz()},320);return}
 if(e.target.closest("#bk")&&step>0&&!lock){step--;wz();return}
 if(e.target.closest("#go")){if(!s.length){$("#msg").textContent="Chọn ít nhất 1 môn.";return}const d={a,s};store.set(KEY,d);res(d)}});
W.addEventListener("change",e=>{if(e.target.type!=="checkbox")return;
 if($$("#subs input:checked").length>3){e.target.checked=false;$("#msg").textContent="Tối đa 3 môn.";return}
 s=$$("#subs input:checked").map(x=>x.value);$("#msg").textContent=""});
function res(d){D0=d;W.hidden=true;R.hidden=false;show(0);scrollTo(0,0)}
function show(r){const{gs,list,mx}=calc(D0);
 if(r===0)R.innerHTML=`${prog(1,2,"1/2")}<div class="card qcard"><h3 class="qt">Bạn nghiêng về</h3><div style="text-align:left">${Object.entries(gs).sort((x,y)=>y[1]-x[1]).slice(0,3).map(([k,v])=>`<div style="margin:18px 0"><i class="fas fa-${GI[k]} ic" style="color:${GC[k]}"></i>${G[k]}<div class="bar"><b style="width:${v/mx*100}%;background:${GC[k]}"></b></div></div>`).join("")}</div></div><div class="nav2"><button class="btn alt" id="redo" aria-label="Làm lại"><i class="fas fa-rotate-left"></i></button><button class="btn" id="nx">Tiếp<i class="fas fa-arrow-right" style="margin-left:9px"></i></button></div>`;
 else R.innerHTML=`${prog(2,2,"2/2")}<h3 style="margin:8px 0 0">Nghề hợp với bạn</h3>${list.slice(0,3).map((t,n)=>`<button class="card cbtn" data-pop="${t.i}" data-s="${D0.s.join("|")}"><span class="no" style="--gc:${GC[t.c[1]]}">${n+1}</span><span class="cb"><span>${t.c[0]}</span><small>Hợp ${t.pct}%</small><span class="bar"><b style="width:${t.pct}%;background:${GC[t.c[1]]}"></b></span></span><i class="fas fa-chevron-right"></i></button>`).join("")}<div class="row"><a class="btn" href="so-sanh.html">So sánh<i class="fas fa-arrow-right" style="margin-left:9px"></i></a><button class="btn alt" id="redo" aria-label="Làm lại"><i class="fas fa-rotate-left"></i></button></div>`}
R.addEventListener("click",e=>{if(e.target.closest("#nx"))show(1);
 if(e.target.closest("#redo")){store.set(KEY,null);a=Q.map(()=>null);step=0;s=[];R.hidden=true;W.hidden=false;wz();scrollTo(0,0)}});
const sv=store.get(KEY,null);
if(sv&&sv.a&&sv.a.length===Q.length){a=sv.a;s=sv.s.filter(x=>SUB.includes(x));res({a,s})}else{if(sv)store.set(KEY,null);wz()}});</script></body></html>
