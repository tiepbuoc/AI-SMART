<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Nghề nghiệp – Ngã Rẽ 10</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&display=swap"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/ui.css"></head><body data-p="careers"><main><div id="box"></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="assets/js/firebase-config.js"></script><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>onData(()=>{
let f=null;const B=$("#box");
const cnt=k=>k==="*"?C.length:C.filter(c=>c[1]===k).length;
function home(){B.innerHTML=`<h2>Bạn thích lĩnh vực nào?</h2><div class="tiles stg">${[["*","Tất cả"],...Object.entries(G)].map(([k,v])=>`<button class="tile" data-f="${k}" style="--gc:${GC[k]||"#2C4BFF"}"><span class="ib"><i class="fas fa-${GI[k]||"layer-group"}"></i></span><b>${v}</b><small>${cnt(k)} nghề</small></button>`).join("")}</div>`}
function list(){B.innerHTML=`<div class="bar2"><button class="btn alt" id="bk" aria-label="Quay lại"><i class="fas fa-arrow-left"></i></button><input type="search" id="kw" placeholder="Tìm nghề" aria-label="Tìm nghề"></div><div id="clist"></div>`;fill()}
function fill(){const kw=$("#kw").value.trim().toLowerCase();
 const r=C.map((c,i)=>i).filter(i=>{const c=C[i];return(f==="*"||c[1]===f)&&(!kw||(c[0]+c[2]+c[4]).toLowerCase().includes(kw))});
 $("#clist").innerHTML=r.length?r.map(i=>`<button class="card cbtn" data-pop="${i}"><span class="ib" style="--gc:${GC[C[i][1]]}"><i class="fas fa-${GI[C[i][1]]}"></i></span><span class="cb"><span>${C[i][0]}</span></span><i class="fas fa-chevron-right"></i></button>`).join(""):`<p class="soft">Không có kết quả.</p>`}
B.addEventListener("click",e=>{const t=e.target.closest("[data-f]");if(t){f=t.dataset.f;list();scrollTo(0,0)}if(e.target.closest("#bk"))home()});
B.addEventListener("input",e=>{if(e.target.id==="kw")fill()});home();});</script></body></html>
